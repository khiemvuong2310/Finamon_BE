name: Build, publish and deploy to MonsterASP.NET

on:
  push:
    branches: [ main ]   # Deploy khi push vào main

jobs:
  build_and_deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # ---------- RESTORE ----------
      - name: Restore dependencies
        run: dotnet restore "SU25-EXE201-Finamon/Finamon/Finamon.csproj"

      # ---------- BUILD ----------
      - name: Build
        run: dotnet build "SU25-EXE201-Finamon/Finamon/Finamon.csproj" --configuration Release --no-restore

      # ---------- PUBLISH ----------
      - name: Publish
        run: dotnet publish "SU25-EXE201-Finamon/Finamon/Finamon.csproj" --configuration Release --output ./publish --runtime win-x86 --self-contained false

      # ---------- ZIP OUTPUT ----------
      - name: Zip publish folder
        run: |
          powershell -Command "if(Test-Path publish.zip){Remove-Item publish.zip -Force}; Compress-Archive -Path 'publish/*' -DestinationPath 'publish.zip' -Force"

      # ---------- DEPLOY ----------
      - name: Deploy to MonsterASP.NET via WebDeploy
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          package: './publish.zip'
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
